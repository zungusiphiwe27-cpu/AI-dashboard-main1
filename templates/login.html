<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Log in — SentiAI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue-900:#0a1628;
  --blue-800:#0f2044;
  --blue-700:#1a3a6e;
  --blue-600:#1d4ed8;
  --blue-500:#2563eb;
  --blue-400:#3b82f6;
  --blue-300:#93c5fd;
  --blue-100:#dbeafe;
  --blue-50: #eff6ff;
  --dark:#f0f4ff;
  --card:#ffffff;
  --border:#c7d9f8;
  --text:#0a1628;
  --muted:#4b6094;
  --error:#dc2626;
}

body{
  background:var(--dark);color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;
}

/* ── Background mesh ── */
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.2;animation:drift 20s infinite ease-in-out}
.orb1{width:500px;height:500px;background:var(--blue-300);top:-150px;right:-100px}
.orb2{width:400px;height:400px;background:#bfdbfe;bottom:-100px;left:-100px;animation-delay:-10s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,20px)}}

/* ── Dot grid overlay ── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(var(--blue-300) 1px,transparent 1px);
  background-size:28px 28px;
  pointer-events:none;z-index:0;opacity:.25;
}

/* ── Container ── */
.container{
  position:relative;z-index:1;width:100%;max-width:440px;
  animation:fadeUp .6s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ── Logo ── */
.logo-wrap{text-align:center;margin-bottom:2.5rem}
.logo{
  font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;
  background:linear-gradient(135deg,var(--blue-700),var(--blue-400));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.logo-sub{color:var(--muted);font-size:.85rem;margin-top:.3rem}

/* ── Card ── */
.card{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:20px;padding:2.5rem;
  position:relative;overflow:hidden;
  box-shadow:0 4px 24px rgba(37,99,235,.1);
}
.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(37,99,235,.03),transparent);
  pointer-events:none;
}

/* ── Typography ── */
h2{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:.4rem;color:var(--blue-900)}
.card-sub{color:var(--muted);font-size:.9rem;margin-bottom:2rem}

/* ── Fields ── */
.field{margin-bottom:1.2rem}
label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:.5rem;letter-spacing:.03em;font-weight:500}

input{
  width:100%;
  background:var(--blue-50);
  border:1.5px solid var(--border);
  border-radius:10px;padding:.85rem 1rem;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:.95rem;
  transition:border-color .2s,box-shadow .2s,background .2s;
  outline:none;
}
input:focus{
  border-color:var(--blue-400);
  box-shadow:0 0 0 3px rgba(59,130,246,.15);
  background:#fff;
}
input::placeholder{color:var(--muted)}

/* ── Main button ── */
.btn{
  width:100%;
  background:linear-gradient(135deg,var(--blue-600),var(--blue-500));
  color:#fff;border:none;border-radius:10px;padding:1rem;
  font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;
  cursor:pointer;transition:opacity .2s,transform .2s,box-shadow .2s;
  margin-top:.5rem;position:relative;overflow:hidden;
  box-shadow:0 4px 16px rgba(37,99,235,.35);
}
.btn:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,.45)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Error message ── */
.error-msg{
  background:#fee2e2;border:1px solid #fecaca;
  border-radius:8px;padding:.75rem 1rem;
  color:var(--error);font-size:.85rem;margin-bottom:1rem;display:none;
}
.error-msg.show{display:block}

/* ── Divider ── */
.divider{
  display:flex;align-items:center;gap:1rem;
  margin:1.5rem 0;color:var(--muted);font-size:.82rem;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Footer link ── */
.footer-link{text-align:center;font-size:.88rem;color:var(--muted)}
.footer-link a{color:var(--blue-500);text-decoration:none;font-weight:500}
.footer-link a:hover{text-decoration:underline}

/* ── Back link ── */
.back-link{text-align:center;margin-top:1.2rem}
.back-link a{color:var(--muted);font-size:.85rem;text-decoration:none;transition:color .2s}
.back-link a:hover{color:var(--blue-600)}

/* ── Button spinner ── */
.spinner{
  display:none;width:18px;height:18px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;animation:spin .6s linear infinite;
  position:absolute;right:1.2rem;top:50%;transform:translateY(-50%);
}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
.btn.loading .spinner{display:block}
.btn.loading .btn-text{opacity:0}
</style>
</head>
<body>
<div class="mesh"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<div class="container">
  <div class="logo-wrap">
    <a href="/" style="text-decoration:none"><div class="logo">SENTI<span style="opacity:.5">AI</span></div></a>
    <div class="logo-sub">Customer Sentiment Intelligence</div>
  </div>

  <div class="card">
    <h2>Welcome back</h2>
    <p class="card-sub">Log in to your SentiAI account</p>

    <div class="error-msg" id="error-msg"></div>

    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <button class="btn" id="login-btn" onclick="doLogin()">
      <span class="btn-text">Log in</span>
      <div class="spinner"></div>
    </button>

    <div class="divider">or</div>

    <div class="footer-link">Don't have an account? <a href="/signup">Sign up free →</a></div>
  </div>

  <div class="back-link"><a href="/">← Back to home</a></div>
</div>

<script>
async function doLogin() {
  const email    = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value.trim()
  const btn      = document.getElementById('login-btn')
  const errEl    = document.getElementById('error-msg')

  errEl.classList.remove('show')
  if (!email || !password) { showError('Please fill in all fields.'); return }

  btn.disabled = true; btn.classList.add('loading')

  try {
    const res  = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, password }) })
    const data = await res.json()
    if (data.success) { window.location.href = data.redirect }
    else              { showError(data.error || 'Login failed.') }
  } catch(e) { showError('Network error. Please try again.') }

  btn.disabled = false; btn.classList.remove('loading')
}

function showError(msg) {
  const el = document.getElementById('error-msg')
  el.textContent = msg; el.classList.add('show')
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin() })
</script>
</body>
</html>
